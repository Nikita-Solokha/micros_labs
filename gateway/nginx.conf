# API Gateway на Nginx — единственная точка входа для клиентов.
#  - маршрутизирует публичные /api/v1/... в нужный сервис;
#  - закрывает доступ к /internal/... снаружи;
#  - проставляет X-Request-Id, если клиент его не передал;
#  - ограничивает частоту запросов (rate limiting);
#  - если сервис недоступен — отвечает 503 в формате Problem Details.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Встроенный DNS docker-compose: адреса сервисов ищутся при каждом запросе,
    # поэтому gateway стартует, даже если какой-то сервис ещё не поднят.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # X-Request-Id: берём от клиента, иначе генерируем
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format gw '$remote_addr "$request" $status rid=$req_id upstream=$upstream_addr time=$request_time';
    access_log /dev/stdout gw;
    error_log  /dev/stderr warn;

    # не более 20 запросов в секунду с одного IP, всплеск до 40
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-Id      $req_id;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout    15s;
        # сервисы тоже возвращают X-Request-Id; убираем их копию, чтобы
        # заголовок в ответе клиенту был ровно один
        proxy_hide_header X-Request-Id;
        add_header X-Request-Id $req_id always;

        error_page 502 503 504 = @unavailable;
        error_page 429 = @ratelimited;

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway"}';
        }

        # --- order-service ---
        location /api/v1/orders {
            limit_req zone=api burst=40 nodelay;
            set $upstream http://order-service:8081;
            proxy_pass $upstream;
        }

        # --- dispatch-service ---
        location /api/v1/couriers/ {
            limit_req zone=api burst=40 nodelay;
            set $upstream http://dispatch-service:8082;
            proxy_pass $upstream;
        }
        location = /api/v1/dispatch/location {
            limit_req zone=api burst=40 nodelay;
            set $upstream http://dispatch-service:8082;
            proxy_pass $upstream;
        }

        # --- payment-service: вебхук банка ---
        location = /api/v1/payments/webhook {
            set $upstream http://payment-service:8083;
            proxy_pass $upstream;
        }

        # --- внутренние эндпоинты снаружи недоступны ---
        location /internal/ {
            default_type application/problem+json;
            return 404 '{"type":"https://api.delivery.com/errors/not-found","title":"Ресурс не найден","status":404,"detail":"внутренние эндпоинты недоступны через API Gateway","instance":"$uri"}';
        }

        location / {
            default_type application/problem+json;
            return 404 '{"type":"https://api.delivery.com/errors/not-found","title":"Ресурс не найден","status":404,"detail":"маршрут не найден","instance":"$uri"}';
        }

        location @unavailable {
            default_type application/problem+json;
            return 503 '{"type":"https://api.delivery.com/errors/unavailable","title":"Сервис временно недоступен","status":503,"detail":"API Gateway не смог связаться с сервисом","instance":"$uri"}';
        }

        location @ratelimited {
            default_type application/problem+json;
            return 429 '{"type":"https://api.delivery.com/errors/too-many-requests","title":"Слишком много запросов","status":429,"detail":"превышен лимит 20 запросов в секунду","instance":"$uri"}';
        }
    }
}
