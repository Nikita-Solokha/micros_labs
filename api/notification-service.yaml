openapi: 3.1.0
info:
  title: notification-service API
  description: Отправка SMS и Push-уведомлений по событиям системы
  version: 1.0.0

paths:
  /internal/v1/notifications/logs:
    get:
      tags: [internal]
      summary: Получить историю отправленных уведомлений с пагинацией
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          example: 1
        - in: query
          name: size
          schema:
            type: integer
            default: 50
          example: 50
      responses:
        '200':
          description: Журнал отправленных уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationLogResponse'
        '400':
          description: Некорректные параметры пагинации
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    NotificationLogItem:
      type: object
      required: [id, recipient, message, channel, sentAt]
      properties:
        id:
          type: string
          format: uuid
          example: "f1e2d3c4-b5a6-7890-1234-56789abcdef0"
        recipient:
          type: string
          example: "+79991234567"
        message:
          type: string
          example: "Курьер назначен на ваш заказ и уже в пути!"
        channel:
          type: string
          enum: [SMS, PUSH]
          example: "SMS"
        sentAt:
          type: string
          format: date-time
          example: "2026-10-30T10:06:20Z"

    NotificationLogResponse:
      type: object
      properties:
        total:
          type: integer
          example: 105
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 50
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationLogItem'

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: "https://api.delivery.com/errors/notification-failed"
        title:
          type: string
          example: "Ошибка сервиса уведомлений"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Неверный формат телефонного номера"