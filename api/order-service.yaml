openapi: 3.1.0
info:
  title: order-service API
  description: Управление жизненным циклом заказов на доставку
  version: 1.0.0

paths:
  /api/v1/orders:
    post:
      tags: [public]
      summary: Создать новый заказ на доставку
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Ключ идемпотентности (UUIDv4) для предотвращения дублей
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              originAddress: "г. Ростов-на-Дону, пл. Гагарина, 1"
              destinationAddress: "г. Ростов-на-Дону, ул. Большая Садовая, 105"
              weight: 2.5
      responses:
        '201':
          description: Заказ успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Неверные данные запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Конфликт ключа идемпотентности
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: payment-service недоступен — заказ отменён (компенсация, cancelReason=PAYMENT_SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    get:
      tags: [public]
      summary: Получить список заказов клиента с пагинацией
      parameters:
        - in: header
          name: X-Client-Id
          required: false
          description: Идентификатор клиента (в продакшене проставляется API Gateway из JWT)
          schema:
            type: string
          example: "client-42"
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Номер страницы
          example: 1
        - in: query
          name: size
          schema:
            type: integer
            default: 20
          description: Количество элементов на странице
          example: 20
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /api/v1/orders/{orderId}:
    get:
      tags: [public]
      summary: Получить статус и детали конкретного заказа
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
            example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
      responses:
        '200':
          description: Детали заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказ не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /internal/v1/orders/{orderId}/status:
    get:
      tags: [internal]
      summary: Внутренний эндпоинт для проверки статуса заказа другими сервисами
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Текущий статус заказа
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  status: { type: string, example: "PAID" }
              example:
                orderId: "d290f1ee-6c54-4b01-90e6-d701748f0851"
                status: "PAID"

  /internal/v1/orders/{orderId}/delivered:
    post:
      tags: [internal]
      summary: Отметить заказ доставленным (вызывается из dispatch-service, ЛР4)
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierId]
              properties:
                courierId:
                  type: string
            example:
              courierId: "4c5b6a7d-8e9f-0a1b-2c3d-4e5f6a7b8c9d"
      responses:
        '200':
          description: Заказ переведён в DELIVERED (повторный вызов идемпотентен), публикуется order.delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string, format: uuid }
                  status: { type: string, example: "DELIVERED" }
        '400':
          description: Не передан courierId
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Заказ не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Недопустимый переход статуса (заказ не ASSIGNED или назначен другому курьеру)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [originAddress, destinationAddress, weight]
      properties:
        originAddress:
          type: string
        destinationAddress:
          type: string
        weight:
          type: number
          format: float

    Order:
      type: object
      required: [id, status, originAddress, destinationAddress, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, ASSIGNED, DELIVERED, CANCELLED]
          example: PENDING_PAYMENT
        originAddress:
          type: string
          example: "г. Ростов-на-Дону, пл. Гагарина, 1"
        destinationAddress:
          type: string
          example: "г. Ростов-на-Дону, ул. Большая Садовая, 105"
        weight:
          type: number
          format: float
          example: 2.5
        price:
          type: number
          format: float
          description: "Стоимость: 200 + 100 * вес (кг)"
          example: 450
        paymentId:
          type: string
          format: uuid
        paymentUrl:
          type: string
          format: uri
          example: "https://pay.bank.com/session/d290f1ee"
        courierId:
          type: string
          description: Назначенный курьер (после dispatch.courier_assigned)
        cancelReason:
          type: string
          enum: [PAYMENT_FAILED, PAYMENT_SERVICE_UNAVAILABLE, COURIER_NOT_FOUND]
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          example: "2026-10-30T10:00:00Z"

    OrderListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 1
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: "https://api.delivery.com/errors/bad-request"
        title:
          type: string
          example: "Неверные параметры запроса"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Вес посылки не может быть отрицательным"

    # --- Асинхронные события Kafka (Топик: orders.events, Издатель: order-service) ---
    OrderCreatedEvent:
      type: object
      description: "Топик: orders.events | Издатель: order-service | Подписчики: dispatch-service (сохраняет адрес забора)"
      required: [eventId, eventType, schemaVersion, occurredAt, correlationId, payload]
      properties:
        eventId:
          type: string
          format: uuid
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        eventType:
          type: string
          example: "order.created"
        schemaVersion:
          type: integer
          example: 1
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-30T10:00:01Z"
        correlationId:
          type: string
          format: uuid
          description: "orderId — связывает все события одного заказа (шаги саги)"
        payload:
          $ref: '#/components/schemas/Order'

    OrderDeliveredEvent:
      type: object
      description: "Топик: orders.events | Издатель: order-service | Подписчики: notification-service"
      required: [eventId, eventType, schemaVersion, occurredAt, correlationId, payload]
      properties:
        eventId:
          type: string
          format: uuid
          example: "7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b"
        eventType:
          type: string
          example: "order.delivered"
        schemaVersion:
          type: integer
          example: 1
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-30T11:30:00Z"
        correlationId:
          type: string
          format: uuid
          description: "orderId — связывает все события одного заказа (шаги саги)"
        payload:
          type: object
          required: [orderId, courierId, deliveredAt]
          properties:
            orderId: { type: string, format: uuid }
            courierId: { type: string }
            deliveredAt: { type: string, format: date-time }