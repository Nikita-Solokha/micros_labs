# Вся система лабораторной работы №4 одной командой:
#   docker compose up -d --build
#
# Точки входа на хосте:
#   http://localhost:8080  — API Gateway (единственная точка входа для клиента)
#   http://localhost:8090  — Kafka UI
#   http://localhost:9090  — банк-заглушка (сюда ведёт paymentUrl)
#   8081-8084              — сервисы напрямую, только для отладки и проверки internal-эндпоинтов
#
# Демонстрационные настройки можно менять переменными окружения хоста:
#   SEARCH_TIMEOUT (по умолчанию 20s; по ТЗ — 15m), SMS_FAIL, FAIL_REFUNDS

x-go-service: &go-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

x-common-env: &common-env
  KAFKA_BROKERS: kafka:29092
  WEBHOOK_SECRET: dev-secret

services:
  # ------------------------------------------------------------ инфраструктура
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # режим KRaft, ZooKeeper не нужен
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in orders.events payments.events dispatch.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------ API Gateway
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service
      - dispatch-service
      - payment-service
    restart: unless-stopped

  # ------------------------------------------------------------ бизнес-сервисы
  order-service:
    <<: *go-service
    container_name: order-service
    build:
      context: .
      args:
        SERVICE: services/order-service
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      PORT: "8081"
      PAYMENT_URL: http://payment-service:8083
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      retries: 10

  dispatch-service:
    <<: *go-service
    container_name: dispatch-service
    build:
      context: .
      args:
        SERVICE: services/dispatch-service
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      PORT: "8082"
      ORDER_URL: http://order-service:8081
      SEARCH_TIMEOUT: ${SEARCH_TIMEOUT:-20s}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      retries: 10

  payment-service:
    <<: *go-service
    container_name: payment-service
    build:
      context: .
      args:
        SERVICE: services/payment-service
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      PORT: "8083"
      BANK_URL: http://bank-mock:9090
      # банк присылает вебхук через API Gateway, как внешняя система
      WEBHOOK_URL: http://gateway:8080/api/v1/payments/webhook
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 5s
      retries: 10

  notification-service:
    <<: *go-service
    container_name: notification-service
    build:
      context: .
      args:
        SERVICE: services/notification-service
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      PORT: "8084"
      SMS_FAIL: ${SMS_FAIL:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 5s
      retries: 10

  # ------------------------------------------------------------ моки внешних систем
  bank-mock:
    container_name: bank-mock
    build:
      context: .
      args:
        SERVICE: mocks/bank-mock
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      PORT: "9090"
      PUBLIC_URL: http://localhost:9090   # ссылка на оплату открывается в браузере хоста
      WEBHOOK_SECRET: dev-secret
      FAIL_REFUNDS: ${FAIL_REFUNDS:-false}
